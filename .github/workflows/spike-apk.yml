name: spike-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: APK arm64 (GameActivity + Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK bits
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build .so (aarch64)
        run: |
          cargo ndk -t arm64-v8a -o app/src/main/jniLibs build --lib
          ls -la app/src/main/jniLibs/arm64-v8a/
          file app/src/main/jniLibs/arm64-v8a/*.so

      - name: Gradle assembleDebug
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact (before gates, so failures keep the APK)
        uses: actions/upload-artifact@v4
        with:
          name: oc-gui-debug-apk-arm64
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: "Gate: zipalign + apksigner + ELF"
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$ANDROID_HOME/build-tools/36.0.0
          ls -la "$APK"
          echo "== zipalign verify (16KB pages, -P capital) =="
          "$BT/zipalign" -c -P 16 "$APK" && echo "ZIPALIGN-16K-OK"
          echo "== apksigner verify =="
          "$BT/apksigner" verify --print-certs "$APK" && echo "APKSIGNER-OK"
          echo "== ELF arch + 16KB LOAD alignment =="
          unzip -o "$APK" 'lib/*' -d /tmp/apk-check >/dev/null
          file /tmp/apk-check/lib/arm64-v8a/*.so | grep -q 'aarch64' || { echo 'wrong ELF arch'; exit 1; }
          readelf -lW /tmp/apk-check/lib/arm64-v8a/*.so | grep -q '0x4000' || { echo 'ELF LOAD alignment must be 0x4000 (16KB page)'; exit 1; }
          echo "ELF-GATE-OK"

      - name: "Gate: aapt2 badging"
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$ANDROID_HOME/build-tools/36.0.0
          "$BT/aapt2" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='io.opencrabs.mobile.gui'" /tmp/badging.txt
          grep -q "sdkVersion:'26'" /tmp/badging.txt
          grep -q "native-code: 'arm64-v8a'" /tmp/badging.txt


  emulator-selftest:
    name: Emulator self-test (keyboard + typed text)
    runs-on: ubuntu-latest
    needs: build-apk
    env:
      # Escape hatch of the emulator binary itself: if the runner has no KVM,
      # boot falls back to TCG software emulation instead of hard-failing
      # (error seen on run 45411777387). Ignored when KVM is present.
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK bits
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build .so (x86_64, for emulator)
        run: |
          cargo ndk -t x86_64 -o app/src/main/jniLibs build --lib
          file app/src/main/jniLibs/x86_64/*.so

      - name: Gradle assembleDebug (x86_64 APK)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Boot emulator (api-34 x86_64, KVM)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          script: |
            APK=app/build/outputs/apk/debug/app-debug.apk
            ls -la "$APK"

            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n io.opencrabs.mobile.gui/.MainActivity

            # 1. App ready + textfield coords
            TAPP=0
            until adb logcat -d -s OcGui | grep -q TEXTFIELD; do
              TAPP=$((TAPP+5))
              if [ "$TAPP" -ge 120 ]; then
                echo "--- boot timeout, last OcGui log ---"
                adb logcat -d -s OcGui | tail -40
                adb shell screencap -p /sdcard/fail-boot.png && adb pull /sdcard/fail-boot.png
                exit 1
              fi
              sleep 5
            done
            adb logcat -d -s OcGui | grep -E 'APP_START|APP_READY|TEXTFIELD|FOCUS|IME' | tail -20

            PXCX=$(adb logcat -d -s OcGui | grep TEXTFIELD | tail -1 | sed 's/.*pxcx=\([0-9]*\).*/\1/')
            PXCY=$(adb logcat -d -s OcGui | grep TEXTFIELD | tail -1 | sed 's/.*pxcy=\([0-9]*\).*/\1/')
            echo "tap target: $PXCX x $PXCY"
            [ "$PXCX" -gt 0 ] && [ "$PXCY" -gt 0 ] || { echo 'invalid tap coords'; exit 1; }

            adb shell input tap "$PXCX" "$PXCY"

            # 2. IME must actually show
            TKB=0
            until adb shell dumpsys input_method | grep -q 'mInputShown=true'; do
              TKB=$((TKB+5))
              if [ "$TKB" -ge 90 ]; then
                echo "--- keyboard never showed ---"
                adb logcat -d -s OcGui | tail -40
                adb shell dumpsys input_method | grep -E 'mInputShown|mImeWindowVis|mInputViewShown' || true
                adb shell screencap -p /sdcard/fail-kb.png && adb pull /sdcard/fail-kb.png
                exit 1
              fi
              sleep 5
            done
            echo "KEYBOARD SHOWN"

            # 3. Type via IME and require egui to receive it
            adb shell input text "halo123"
            TTYPED=0
            until adb logcat -d -s OcGui | grep -qE 'TYPED chars=[1-9]'; do
              TTYPED=$((TTYPED+5))
              if [ "$TTYPED" -ge 60 ]; then
                echo "--- typed text never reached egui ---"
                adb logcat -d -s OcGui | tail -40
                adb shell screencap -p /sdcard/fail-typed.png && adb pull /sdcard/fail-typed.png
                exit 1
              fi
              sleep 5
            done
            adb logcat -d -s OcGui | grep -E 'IME_TEXT|IME_ADOPT|TYPED' | tail -20

            adb shell screencap -p /sdcard/pass.png && adb pull /sdcard/pass.png
            echo "SELFTEST PASS: keyboard shown + typed chars > 0"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screens
          path: |
            pass.png
            fail-*.png
