name: spike-apk

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/29.0.14206865
    steps:
      - uses: actions/checkout@v4

      - name: Install SDK components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install "ndk;29.0.14206865" "build-tools;36.0.0" "platforms;android-35"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-apk (patched rev, per egui hello_android README)
        run: cargo install --git https://github.com/parasyte/cargo-apk.git --rev 282639508eeed7d73f2e1eaeea042da2716436d5 cargo-apk

      - name: Build APK (release, stripped)
        run: |
          export PATH="${ANDROID_NDK_ROOT}:$PATH"
          cargo apk build -p oc-gui --lib --release
          find target/release/apk -name '*.apk' -print -exec ls -l {} \;

      - name: Verify badging
        run: |
          APK=$(find target/release/apk -name '*.apk' | head -1)
          ${ANDROID_HOME}/build-tools/36.0.0/aapt2 dump badging "$APK" | grep -E "package:|sdkVersion|native-code"

      - uses: actions/upload-artifact@v4
        with:
          name: oc-gui-spike-apk
          path: target/release/apk/**/*.apk
