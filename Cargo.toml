[package]
name = "oc-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
# cdylib is required for Android, lib is required for desktop
crate-type = ["cdylib", "lib"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
  "default_fonts",
  "glow",
  "android-native-activity",
] }
android_logger = "0.15"
log = "0.4"
winit = "0.30"

[package.metadata.android]
package = "io.opencrabs.mobile.gui"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

# Spike APK is debug-signed (no release keystore in CI), so keep the dev profile
# but strip symbols: unstripped the .so is 141 MB and will not upload to chat.
[profile.dev]
strip = "symbols"
